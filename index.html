<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Page</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


body{

    background:#f5f7fb;
    color:#222;

}



/*语言栏*/

.language-bar{

    width:100%;
    background:#111827;
    padding:12px;
    text-align:right;

}



.language-bar button{

    margin-left:8px;

    padding:6px 12px;

    border:none;

    border-radius:20px;

    cursor:pointer;

    background:white;

    font-size:14px;

}




/*主体*/

.container{

    min-height:90vh;

    display:flex;

    justify-content:center;

    align-items:center;

}




.card{

    width:90%;

    max-width:450px;

    background:white;

    padding:40px 30px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

    text-align:center;

}





.logo{

    width:80px;

    height:80px;

    background:#111827;

    border-radius:50%;

    margin:auto;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

}





h1{

    margin-top:25px;

    font-size:28px;

}





.desc{

    margin:20px 0;

    color:#666;

    line-height:1.6;

}





.contact-btn{

    display:block;

    margin:15px 0;

    padding:15px;

    border-radius:30px;

    text-decoration:none;

    color:white;

    font-size:17px;

}





.whatsapp{

    background:#25D366;

}





.telegram{

    background:#229ED9;

}





.footer{

    margin-top:25px;

    font-size:13px;

    color:#999;

}


#error{

    color:red;

    margin-top:20px;

    font-size:14px;

}


</style>


</head>



<body>



<div class="language-bar">


<button onclick="changeLang('zh')">

中文

</button>



<button onclick="changeLang('en')">

English

</button>



<button onclick="changeLang('es')">

Español

</button>


</div>





<div class="container">


<div class="card">



<div class="logo">

C

</div>




<h1 id="title">

Loading...

</h1>




<p class="desc" id="desc">

</p>





<a 
id="whatsapp"

class="contact-btn whatsapp"

target="_blank"
rel="noopener">

WhatsApp

</a>





<a 

id="telegram"

class="contact-btn telegram"

target="_blank"
rel="noopener">

Telegram

</a>





<div class="footer" id="footer">

</div>



<div id="error"></div>




</div>


</div>



<script>


let pageData={};



/*

读取CMS文件

路径:

content/page.json

*/


fetch("/my-contact-page/content/page.json")



.then(response=>{


if(!response.ok){

throw new Error("page.json不存在");

}


return response.json();


})



.then(data=>{


pageData=data;



// 设置联系方式

document.getElementById("whatsapp").href =
data.whatsapp || "#";



document.getElementById("telegram").href =
data.telegram || "#";




// 默认西班牙语

changeLang("es");



})



.catch(error=>{


console.log(error);



document.getElementById("error").innerHTML=

"Content loading failed";



});


    function changeLang(lang){



document.documentElement.lang = lang;



if(!pageData){

return;

}




// 标题

document.getElementById("title").innerHTML =

pageData["title_"+lang] || "Contact";





// 描述

document.getElementById("desc").innerHTML =

pageData["description_"+lang] || "";





// 底部文字

document.getElementById("footer").innerHTML =

pageData["footer_"+lang] || "";







// WhatsApp按钮文字

document.getElementById("whatsapp").innerHTML =


lang=="zh"

?

"联系 WhatsApp"

:

lang=="en"

?

"Contact WhatsApp"

:

"Contactar WhatsApp";







// Telegram按钮文字

document.getElementById("telegram").innerHTML =


lang=="zh"

?

"联系 Telegram"

:

lang=="en"

?

"Contact Telegram"

:

"Contactar Telegram";





}




</script>



</body>


</html>
