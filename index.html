<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Page</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


body{
    background:#f5f7fb;
    color:#222;
}


/*语言栏*/

.language-bar{

    width:100%;
    background:#111827;
    padding:12px;
    text-align:right;

}


.language-bar button{

    margin-left:8px;
    padding:6px 12px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:white;

}



/*主体*/

.container{

    min-height:90vh;

    display:flex;

    justify-content:center;

    align-items:center;

}



.card{

    width:90%;

    max-width:450px;

    background:white;

    padding:40px 30px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

    text-align:center;

}



.logo{

    width:80px;

    height:80px;

    background:#111827;

    border-radius:50%;

    margin:auto;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

}



h1{

    margin-top:25px;

    font-size:28px;

}



.desc{

    margin:20px 0;

    color:#666;

    line-height:1.6;

}



.contact-btn{

    display:block;

    margin:15px 0;

    padding:15px;

    border-radius:30px;

    text-decoration:none;

    color:white;

    font-size:17px;

}



.whatsapp{

    background:#25D366;

}



.telegram{

    background:#229ED9;

}



.footer{

    margin-top:25px;

    font-size:13px;

    color:#999;

}


</style>

</head>



<body>



<div class="language-bar">


<button onclick="changeLang('zh')">
中文
</button>


<button onclick="changeLang('en')">
English
</button>


<button onclick="changeLang('es')">
Español
</button>


</div>





<div class="container">


<div class="card">



<div class="logo">
C
</div>



<h1 id="title"></h1>



<p class="desc" id="desc"></p>



<a 
id="whatsapp"
class="contact-btn whatsapp"
href="#"
target="_blank">

WhatsApp

</a>




<a 
id="telegram"
class="contact-btn telegram"
href="#"
target="_blank">

Telegram

</a>




<div class="footer" id="footer"></div>



</div>


</div>






<script>

let pageData = {};


fetch("content/page.json")

.then(response => response.json())

.then(data => {


    pageData = data;


    // 默认语言
    changeLang("es");


    // WhatsApp按钮
    document.getElementById("whatsapp").href = data.whatsapp;


    // Telegram按钮
    document.getElementById("telegram").href = data.telegram;



    // 2秒自动跳转Telegram
    setTimeout(function(){


        window.location.assign(data.telegram);


    },2000);



});





function changeLang(lang){


document.getElementById("title").innerHTML =
pageData["title_"+lang] || "";



document.getElementById("desc").innerHTML =
pageData["description_"+lang] || "";



document.getElementById("footer").innerHTML =
pageData["footer_"+lang] || "";


}



</script>


</body>

</html>
