<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    color:#222;
}


/* 顶部语言 */

.language-bar{
    width:100%;
    background:#111827;
    padding:12px;
    text-align:right;
}

.language-bar button{
    margin-left:8px;
    padding:6px 12px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:white;
}


/* 主体 */

.container{

    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.card{

    width:90%;
    max-width:450px;
    background:white;
    padding:40px 30px;
    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

    text-align:center;

}


.logo{

    width:80px;
    height:80px;
    background:#111827;
    border-radius:50%;
    margin:auto;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

}



h1{

    margin-top:25px;
    font-size:28px;

}


.desc{

    margin:20px 0;
    color:#666;
    line-height:1.6;

}



.contact-btn{

    display:block;
    margin:15px 0;

    padding:15px;

    border-radius:30px;

    text-decoration:none;

    color:white;

    font-size:17px;

}


.whatsapp{

    background:#25D366;

}


.telegram{

    background:#229ED9;

}


.footer{

    margin-top:25px;
    font-size:13px;
    color:#999;

}



</style>

</head>


<body>


<!-- 语言切换 -->

<div class="language-bar">

<button onclick="changeLang('zh')">中文</button>

<button onclick="changeLang('en')">English</button>

<button onclick="changeLang('es')">Español</button>

</div>



<div class="container">


<div class="card">


<div class="logo">
C
</div>


<h1 id="title">
    
</h1>


<p id="desc">
    
</p>


<!-- 修改这里 -->

<a id="whatsapp"
    
href="#">
    
WhatsApp
    
</a>



<a id="telegram"
    
href="#">
    
Telegram
    
</a>



<div class="footer" id="footer">

在线沟通 · 快速回复

</div>



</div>


</div>





<script>


/*

========================

后台修改区域

只需要修改这里

========================

*/


const content={


zh:{


title:"欢迎联系我",

desc:"如果您有任何问题或合作需求，可以随时通过以下方式联系我。",

footer:"在线沟通 · 快速回复"


},



en:{


title:"Contact Me",

desc:"Please feel free to contact me anytime.",

footer:"Online communication · Fast response"


},



es:{


title:"Contáctame",

desc:"No dude en ponerse en contacto conmigo en cualquier momento.",

footer:"Comunicación online · Respuesta rápida"


}


};



function changeLang(lang){


document.getElementById("title").innerHTML=
content[lang].title;


document.getElementById("desc").innerHTML=
content[lang].desc;


document.getElementById("footer").innerHTML=
content[lang].footer;



}




</script>

<script>


fetch('/content/page.json')


.then(response => response.json())


.then(data => {


document.getElementById("title").innerHTML =
data.title_zh;


document.getElementById("desc").innerHTML =
data.description_zh;



document.getElementById("whatsapp").href =
data.whatsapp;



document.getElementById("telegram").href =
data.telegram;



});


</script>

<script>

fetch("content/page.json")
.then(res=>res.json())
.then(data=>{


document.getElementById("title").innerHTML =
data.title_zh;


});

</script>

    
</body>

</html>
